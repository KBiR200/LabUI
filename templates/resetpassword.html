<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
      <link rel="stylesheet" href="{% static 'css/navbar8.css' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Task Management</title>
    <style>


        body.light {
            background-color: #fafafa;
            color: #333;
        }

        .container {
            width: 100hv;
            {% comment %} max-width: 400px; {% endcomment %}
            padding: 20px;
            background-color: #1e1e2f;
            color: #f4f4f9;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            display: flex;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container.light {
            background-color: #fff;
            color: #333;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #2c2c3e;
            color: #fff;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        input.light {
            background-color: #fff;
            color: #333;
        }

        button {
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .btn.light {
            background-color: #dcdcdc;
            color: #333;
        }

        .btn.light:hover {
            background-color: #b0b0b0;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            text-decoration: underline;
        }

        a.light {
            color: #007bff;
        }

        a.light:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    {% include "components/navbar8.html" %}

    <div class="container">
        <h1>Reset Your Password</h1>
        <form method="POST" action="{% url 'password_reset' %}">
            {% csrf_token %}
            <label for="old_password">Old Password:</label>
            <input type="password" id="old_password" name="old_password" placeholder="Enter your old password" required>
            
            <label for="new_password">New Password:</label>
            <input type="password" id="new_password" name="new_password" placeholder="Enter your new password" required>
            
            <label for="confirm_password">Confirm New Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your new password" required>
            
            <button type="submit" class="btn">Reset Password</button>
        </form>
        <div class="message">
            <a href="{% url 'home' %}">Back to Dashboard</a>
        </div>
    </div>
    <script>
        function toggleTheme() {
            const body = document.body;
            const container = document.querySelector('.container');
            const inputs = document.querySelectorAll('input');
            const buttons = document.querySelectorAll('button');
            const links = document.querySelectorAll('a');

            body.classList.toggle('light');
            container.classList.toggle('light');
            inputs.forEach(input => input.classList.toggle('light'));
            buttons.forEach(btn => btn.classList.toggle('light'));
            links.forEach(link => link.classList.toggle('light'));

            localStorage.setItem('theme', body.classList.contains('light') ? 'light' : 'dark');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                toggleTheme(); // Apply light theme if saved
            }
        });
    </script>
</body>
</html>
