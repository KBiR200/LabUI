<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            height: 100%;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light {
            background-color: #ffffff;
            color: #333333;
        }

        header {
            background-color: #1e1e2f;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        header.light {
            background-color: #f4f4f9;
            color: #333333;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1rem 0;
        }

        nav a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }

        nav a.active {
            background-color: #007bff;
        }

        .sub-header {
            background-color: #2c2c3e;
            color: white;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .sub-header a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            background-color: #1e1e2f;
        }

        .sub-header a.active {
            background-color: #007bff;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: #1e1e2f;
            border-radius: 10px;
            flex-grow: 1;
        }

        .container.light {
            background-color: #f4f4f9;
        }

        .section {
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .section-block {
            background-color: #2c2c3e;
            padding: 1rem;
            border-radius: 5px;
            flex: 1 1 calc(33.333% - 1rem);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section-block.light {
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .section-block h2 {
            margin-bottom: 0.5rem;
        }

        .task-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto auto;
            gap: 0.5rem;
            align-items: center;
            margin: 0.5rem 0;
        }

        .task-item button {
            margin-left: 0.5rem;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .task-item .view-button {
            background-color: #007bff;
            color: white;
        }

        .task-item .update-button {
            background-color: #28a745;
            color: white;
        }

        .task-item .submit-button {
            background-color: #ffc107;
            color: white;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #1e1e2f;
            color: white;
        }

        footer.light {
            background-color: #f4f4f9;
            color: #333333;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }

        .theme-toggle:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            .sub-header {
                flex-direction: column;
                align-items: center;
            }

            .section-block {
                flex: 1 1 100%;
            }

            .task-item {
                grid-template-columns: 1fr auto auto auto;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">Switch to Light Theme</button>
    <header>
        <h1>Laboratory Details</h1>
        <nav>
            <a href="#">Dashboard</a>
            <a href="#" class="active">Labs</a>
            <a href="#">Tasks</a>
            <a href="#">History</a>
        </nav>
    </header>

    <div class="sub-header">
        <a href="#lab1" onclick="openLab('lab1')">Lab 1</a>
        <a href="#lab2" onclick="openLab('lab2')">Lab 2</a>
        <a href="#lab3" onclick="openLab('lab3')">Lab 3</a>
    </div>

    <div class="container" id="lab1" style="display: none;">
        <div class="section">
            <div class="section-block">
                <h2>Papers Needed</h2>
                <ul>
                    <li>Experiment Protocol</li>
                    <li>Safety Guidelines</li>
                </ul>
            </div>
            <div class="section-block">
                <h2>Machines</h2>
                <ul>
                    <li>Microscope</li>
                    <li>Spectrometer</li>
                </ul>
            </div>
            <div class="section-block">
                <h2>Ongoing Tasks</h2>
                <ul>
                    <li class="task-item">
                        <span>Calibration of Equipment</span>
                        <button class="view-button">View</button>
                        <button class="update-button">Update</button>
                        <button class="submit-button">Submit</button>
                    </li>
                    <li class="task-item">
                        <span>Sample Preparation</span>
                        <button class="view-button">View</button>
                        <button class="update-button">Update</button>
                        <button class="submit-button">Submit</button>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Laboratory Management System</p>
    </footer>

    <script>
        function toggleTheme() {
            const body = document.body;
            const header = document.querySelector('header');
            const footer = document.querySelector('footer');
            const containers = document.querySelectorAll('.container');
            const sectionBlocks = document.querySelectorAll('.section-block');

            body.classList.toggle('light');
            header.classList.toggle('light');
            footer.classList.toggle('light');

            containers.forEach(container => container.classList.toggle('light'));
            sectionBlocks.forEach(block => block.classList.toggle('light'));

            const themeToggle = document.querySelector('.theme-toggle');
            themeToggle.textContent = body.classList.contains('light') ? 'Switch to Dark Theme' : 'Switch to Light Theme';
        }

        function openLab(labId) {
            const labs = document.querySelectorAll('.container');
            labs.forEach(lab => lab.style.display = 'none');
            document.getElementById(labId).style.display = 'block';
        }
    </script>
</body>
</html>
